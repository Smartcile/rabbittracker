services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rabbittracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rabbittracker}
      POSTGRES_DB: ${POSTGRES_DB:-rabbittracker}
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - rt_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rabbittracker} -d ${POSTGRES_DB:-rabbittracker}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_PORT: 8091
      DATABASE_URL: postgres://${POSTGRES_USER:-rabbittracker}:${POSTGRES_PASSWORD:-rabbittracker}@db:5432/${POSTGRES_DB:-rabbittracker}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-10080}
      DATA_DIR: /data
    ports:
      - "${APP_PORT:-8091}:8091"
    volumes:
      - rt_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8091/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  rt_data:
  rt_db:
