# RabbitTracker — Portainer stack (prebuilt image, no build step).
#
# Portainer: Stacks -> Add stack -> Web editor, paste this file, then click
# "Deploy the stack". Every ${VAR:-default} below can be overridden in the
# stack's Environment variables section, or by editing the default in place:
#
#   APP_PORT=8091                Host port the app is published on
#   POSTGRES_USER=rabbittracker
#   POSTGRES_PASSWORD=rabbittracker
#   POSTGRES_DB=rabbittracker
#   COOKIE_SECURE=false          Set true only when serving over HTTPS
#   SESSION_IDLE_MINUTES=30
#   SESSION_TTL_MINUTES=10080
#
# The database is not published on the host — the app talks to it over the
# stack network. The app image is published to GitHub Container Registry by
# .github/workflows/docker-publish.yml. If the package is private, either make
# it public in GitHub -> Packages -> rabbittracker -> Package settings, or add
# a Portainer registry credential for ghcr.io (username: your GitHub username,
# password: a classic PAT with the read:packages scope).

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rabbittracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rabbittracker}
      POSTGRES_DB: ${POSTGRES_DB:-rabbittracker}
    volumes:
      - rt_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rabbittracker} -d ${POSTGRES_DB:-rabbittracker}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    image: ghcr.io/smartcile/rabbittracker:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_PORT: 8091
      DATABASE_URL: postgres://${POSTGRES_USER:-rabbittracker}:${POSTGRES_PASSWORD:-rabbittracker}@db:5432/${POSTGRES_DB:-rabbittracker}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-10080}
      DATA_DIR: /data
    ports:
      - "${APP_PORT:-8091}:8091"
    volumes:
      - rt_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8091/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  rt_data:
  rt_db:
